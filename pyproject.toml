[project]
name = "webdriverwrapper"
version = "2.9.0"
description = "Better interface for WebDriver (Selenium 4)."
readme = "README.md"
license = {text = "PSF"}
authors = [
    {name = "Michal Horejsek", email = "horejsekmichal@gmail.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests",
    "selenium>=4.0.0",
]

[project.optional-dependencies]
suggestion = ["python-Levenshtein"]
devel = [
    "pylint",
    "pytest",
    "pyvirtualdisplay",
]

[project.urls]
Homepage = "https://github.com/horejsek/python-webdriverwrapper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webdriverwrapper", "webdriverwrapper.pytest", "webdriverwrapper.unittest"]
